<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RAMS Basketball Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff5e00;
            --dark-bg: #050505;
            --card-bg: #0f0f0f;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark-bg); color: var(--text-main); overflow-x: hidden; }

        /* --- HEADER & NAVIGATION --- */
        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 3000;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 94, 0, 0.2);
        }

        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 1px; z-index: 4000; }
        .logo span { color: var(--primary); }

        /* Menu Mobile Toggle (Hamburger) */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
            z-index: 4000;
        }
        .menu-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-toggle.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        /* Nav Overlay */
        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0);
            z-index: 3500;
        }
        .nav-overlay.active { right: 0; }

        .nav-links { list-style: none; text-align: center; }
        .nav-links li { margin: 2rem 0; opacity: 0; transform: translateY(30px); transition: 0.5s; }
        .nav-overlay.active .nav-links li { opacity: 1; transform: translateY(0); }
        .nav-overlay.active li:nth-child(1) { transition-delay: 0.2s; }
        .nav-overlay.active li:nth-child(2) { transition-delay: 0.3s; }
        .nav-overlay.active li:nth-child(3) { transition-delay: 0.4s; }
        .nav-overlay.active li:nth-child(4) { transition-delay: 0.5s; }

        .nav-links a {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--primary); }

        /* Desktop Nav Styles */
        @media (min-width: 969px) {
            .menu-toggle { display: none; }
            .nav-overlay { position: static; height: auto; width: auto; background: transparent; right: 0; }
            .nav-links { display: flex; gap: 2rem; }
            .nav-links li { margin: 0; opacity: 1; transform: none; }
            .nav-links a { font-size: 0.9rem; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; }
        }

        /* --- CONTACT CONTENT --- */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            padding-top: 80px;
        }

        .side-info {
            padding: 10% 12%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .side-info h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem, 10vw, 7rem); line-height: 0.9; margin-bottom: 2rem; }
        .side-info h1 span { color: var(--primary); font-style: italic; }

        .contact-item { margin-bottom: 2rem; }
        .contact-item h4 { font-family: 'Bebas Neue', sans-serif; color: var(--primary); font-size: 1.4rem; margin-bottom: 5px; }
        .contact-item p { color: var(--text-dim); font-size: 1.1rem; font-weight: 300; }

        .side-form {
            background: var(--card-bg);
            padding: 10% 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-group { position: relative; margin-bottom: 40px; }
        .form-group input, .form-group textarea {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            padding: 10px 0; color: white; font-family: inherit; font-size: 1rem; transition: 0.3s;
        }
        .form-group label {
            position: absolute; top: 10px; left: 0; color: #555; text-transform: uppercase;
            font-weight: 700; font-size: 0.75rem; pointer-events: none; transition: 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus { outline: none; border-bottom-color: var(--primary); }
        .form-group input:focus ~ label, .form-group input:valid ~ label,
        .form-group textarea:focus ~ label, .form-group textarea:valid ~ label {
            top: -20px; font-size: 0.7rem; color: var(--primary);
        }

        .submit-btn {
            background: var(--primary); color: white; border: none; padding: 20px;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; cursor: pointer;
            transition: 0.3s; clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
        }
        .submit-btn:hover { background: white; color: black; transform: translateX(10px); }

        #successMessage { display: none; text-align: center; animation: fadeInUp 0.5s forwards; }
        #successMessage h2 { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--primary); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 968px) {
            .main-container { grid-template-columns: 1fr; }
            .side-info { order: 2; padding: 60px 5%; }
            .side-form { order: 1; padding: 100px 5% 60px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">RAMS <span>ACADEMY</span></div>
    <div class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
    </div>
    <nav class="nav-overlay" id="navOverlay">
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="boutique.html">Boutique</a></li>
            <li><a href="inscription.html">Rejoindre</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="main-container">
    
    <section class="side-info">
        <h1>LET'S <br><span>PLAY.</span></h1>
        
        <div class="contact-item">
            <h4>Email</h4>
            <p>ramssports25@gmail.com</p>
        </div>

        <div class="contact-item">
            <h4>WhatsApp</h4>
            <p>+229 01 66 39 67 55</p>
        </div>

        <div class="contact-item">
            <h4>Localisation</h4>
            <p>Bohicon, Bénin, Afrique de l'Ouest</p>
        </div>
    </section>

    <section class="side-form">
        <div id="successMessage">
            <h2>MESSAGE ENVOYÉ !</h2>
            <p>Nous vous répondrons dans les plus brefs délais.</p>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <input type="text" name="nom" id="nom" required autocomplete="off">
                <label for="nom">Nom Complet</label>
            </div>

            <div class="form-group">
                <input type="email" name="email" id="email" required autocomplete="off">
                <label for="email">Email</label>
            </div>

            <div class="form-group">
                <input type="text" name="sujet" id="sujet" required autocomplete="off">
                <label for="sujet">Sujet</label>
            </div>

            <div class="form-group">
                <textarea name="message" id="msg" rows="4" required></textarea>
                <label for="msg">Votre message</label>
            </div>

            <button type="submit" class="submit-btn" id="btnTxt">Envoyer l'email</button>
        </form>
    </section>

</main>

<script>
    // --- GESTION DU MENU ---
    const menuToggle = document.getElementById('menuToggle');
    const navOverlay = document.getElementById('navOverlay');
    
    menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navOverlay.classList.toggle('active');
        document.body.style.overflow = navOverlay.classList.contains('active') ? 'hidden' : 'auto';
    });

    // --- ENVOI AJAX PRO ---
    const contactForm = document.getElementById('contactForm');
    const btnTxt = document.getElementById('btnTxt');
    const successMsg = document.getElementById('successMessage');

    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnTxt.innerText = "ENVOI EN COURS...";
        btnTxt.disabled = true;

        const formData = new FormData(contactForm);
        const data = {};
        formData.forEach((val, key) => {
            data[key] = val.toString().replace(/<\/?[^>]+(>|$)/g, ""); // Sécurité XSS
        });

        try {
            const response = await fetch("https://formspree.io/f/mkovbelj", {
                method: "POST",
                body: JSON.stringify(data),
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
            });

            if (response.ok) {
                contactForm.style.display = 'none';
                successMsg.style.display = 'block';
            } else {
                throw new Error();
            }
        } catch (err) {
            alert("Erreur lors de l'envoi. Veuillez réessayer.");
            btnTxt.innerText = "ENVOYER L'EMAIL";
            btnTxt.disabled = false;
        }
    });
</script>

</body>
</html>
